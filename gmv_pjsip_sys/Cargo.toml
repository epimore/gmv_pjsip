[package]
name = "gmv_pjsip_sys"
version = "0.1.0"
edition = "2021"
links = "pjsip"
build = "build.rs"
description = "Low-level Rust FFI bindings for PJPROJECT/PJSIP used by gmv_pjsip."
license = "MIT OR Apache-2.0"

[features]
default = ["bindgen"]
bindgen = ["dep:bindgen"]

[dependencies]
libc = "0.2"

[build-dependencies]
bindgen = { version = "0.70", optional = true }
pkg-config = "0.3"
cc = "1"
